openapi: 3.0.3
info:
  title: Organization Device Tracking API
  version: 1.0.0
  description: API for managing organizations, devices (shovels), users, sessions, spots and logs.
servers:
  - url: https://api.example.com/v1

components:
  schemas:
    Organization:
      type: object
      required:
        - name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 255
        legal_form:
          type: string
          maxLength: 50
          description: The legal structure of the organization e.g., AG, GmbH, Verein, Stiftung
        registration_number:
          type: string
          maxLength: 20
          description: Official Swiss UID (CHE) company registration number, e.g., CHE-123.456.789
        street:
          type: string
          maxLength: 255
          description: Street name and number
        postal_code:
          type: string
          maxLength: 20
        city:
          type: string
          maxLength: 100
        country:
          type: string
          maxLength: 2
          default: CH
          description: ISO 3166-1 alpha-2 country code
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Shovel:
      type: object
      required:
        - id
        - organization_id
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the device
        organization_id:
          type: string
          format: uuid
          description: The organization that owns this device
        serial_number:
          type: string
          maxLength: 100
          description: Unique device serial number
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ShovelLog:
      type: object
      required:
        - id
        - shovel_id
        - status
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the status log entry
        shovel_id:
          type: string
          format: uuid
          description: The shovel this log entry belongs to
        status:
          type: string
          maxLength: 50
          description: Status of the shovel (e.g., active, maintenance, retired)
        created_at:
          type: string
          format: date-time

    Role:
      type: object
      required:
        - name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 50
          description: Name of the role (e.g., employee, employer)
        description:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    User:
      type: object
      required:
        - first_name
        - last_name
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
          description: The organization this user belongs to
        role_id:
          type: string
          format: uuid
          description: Reference to the role of the user
        first_name:
          type: string
          maxLength: 100
        last_name:
          type: string
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 150
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Session:
      type: object
      required:
        - id
        - user_id
        - shovel_id
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
          description: The employee who performed the session
        shovel_id:
          type: string
          format: uuid
          description: The device used in the session
        started_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Spot:
      type: object
      required:
        - id
        - organization_id
        - latitude
        - longitude
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        latitude:
          type: number
        longitude:
          type: number
        altitude:
          type: number
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    SessionLog:
      type: object
      required:
        - id
        - session_id
        - latitude
        - longitude
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the session log entry
        session_id:
          type: string
          format: uuid
        spot_id:
          type: string
          format: uuid
        timestamp:
          type: string
          format: date-time
        latitude:
          type: number
        longitude:
          type: number
        altitude:
          type: number
        movement_type:
          type: string
          maxLength: 20
          description: Classified movement type (motion, dig)
        movement_probability:
          type: number
          format: double
          description: Probability returned by the ML model for the movement_type
        employee_confirmed:
          type: boolean
          description: If the employee confirmed the activity
        sensor_data:
          type: object
          description: Raw sensor data (e.g., accelerometer, gyroscope) for the ML model

    SpotLog:
      type: object
      required:
        - id
        - spot_id
        - status
      properties:
        id:
          type: string
          format: uuid
        spot_id:
          type: string
          format: uuid
        status:
          type: string
          maxLength: 20
          description: Status of the spot (not started, in progress, finished)
        created_at:
          type: string
          format: date-time
        session_id:
          type: string
          format: uuid
          description: The session that triggered this status change (optional)

  parameters:
    idPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    limitQuery:
      name: limit
      in: query
      schema:
        type: integer
        default: 50
    offsetQuery:
      name: offset
      in: query
      schema:
        type: integer
        default: 0

  responses:
    NotFound:
      description: Resource not found
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string

